server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth-service
          uri: lb://cloud-service-auth
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://cloud-service-user
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://cloud-service-product
          predicates:
            - Path=/api/products/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://cloud-service-order
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: agent-service
          uri: http://127.0.0.1:9010
          predicates:
            - Path=/api/agent/**
          filters:
            - StripPrefix=1
